# Infraestructura de desarrollo: Postgres con pgvector (+ Vault opcional en modo dev).
#   docker compose up -d db
#   docker compose --profile vault up -d      # incluye Vault
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 5s
      retries: 10

  vault:
    # SOLO DESARROLLO: modo dev = en memoria, sin TLS, KV v2 montado en secret/
    image: hashicorp/vault:latest
    profiles: ["vault"]
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

volumes:
  pgdata: {}
