# Se ejecuta con `streamlit run Home.py` desde la carpeta frontend/ (es donde Streamlit busca este fichero).
# No se fijan colores de fondo/texto: la app sigue el modo claro/oscuro del sistema.
[theme]
primaryColor = "#16a34a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
