name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Python tests, API contracts, web and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: \${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend unit and OpenAPI tests
        working-directory: backend
        run: pytest -q tests/test_pure.py tests/test_openapi.py

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Generate OpenAPI and TypeScript contracts
        run: pnpm contracts:generate

      - name: Type-check contracts, web and mobile
        run: pnpm typecheck

      - name: Test mobile helpers
        run: pnpm test:mobile

      - name: Build web
        run: pnpm build:web

      - name: Export mobile bundles
        run: pnpm build:mobile

      - name: Build production web container
        run: docker build -f apps/web/Dockerfile -t smartfit-web:ci .
