name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Python tests and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run pure backend tests
        working-directory: backend
        run: pytest -q tests/test_pure.py

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI and TypeScript contracts
        run: pnpm contracts:generate

      - name: Type-check contracts
        run: pnpm typecheck
