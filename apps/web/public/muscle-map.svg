<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Mapa anatómico muscular, vista frontal y posterior</title>
<desc id="desc">Ilustración vectorial anatómica deportiva con musculatura principal diferenciada en vistas anterior y posterior.</desc>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d9c4"/><stop offset=".48" stop-color="#e8c3a8"/><stop offset="1" stop-color="#c99b80"/></linearGradient>
 <linearGradient id="skinBack" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7ad94"/><stop offset=".5" stop-color="#f0d0b8"/><stop offset="1" stop-color="#c99b80"/></linearGradient>
 <linearGradient id="muscle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9a83"/><stop offset=".55" stop-color="#e96d62"/><stop offset="1" stop-color="#bd4c4b"/></linearGradient>
 <linearGradient id="muscleAlt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc09b"/><stop offset=".55" stop-color="#f18a70"/><stop offset="1" stop-color="#c85b54"/></linearGradient>
 <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d96862"/><stop offset="1" stop-color="#a94349"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="fibers" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M1 0L5 8" stroke="#8f3e43" stroke-opacity=".18" stroke-width="1"/></pattern>
 <style>
  .outline{stroke:#9d7867;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
  .skin{fill:url(#skin)} .skinBack{fill:url(#skinBack)}
  .m{fill:url(#muscle);stroke:#a84c4b;stroke-width:1.4;stroke-linejoin:round}
  .ma{fill:url(#muscleAlt);stroke:#b65a51;stroke-width:1.25;stroke-linejoin:round}
  .md{fill:url(#deep);stroke:#963f45;stroke-width:1.2;stroke-linejoin:round}
  .fiber{fill:none;stroke:#873f43;stroke-opacity:.27;stroke-width:1.15;stroke-linecap:round}
  .fine{fill:none;stroke:#9d7867;stroke-opacity:.42;stroke-width:1.2;stroke-linecap:round}
  .label{font:600 13px Inter,system-ui,sans-serif;fill:#435365;letter-spacing:.2px}
  .sub{font:500 10px Inter,system-ui,sans-serif;fill:#82909c;letter-spacing:1.8px}
  .call{fill:none;stroke:#9aa7b3;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:2 3}
  .dot{fill:#e87968;stroke:#fff;stroke-width:2}
 </style>
</defs>
