/* ---------- Geometría paramétrica ---------- */
function gridGeom(surf,u0,u1,v0,v1,nu,nv,thick,base){
  const pos=[], idx=[];
  for(let i=0;i<=nu;i++){
    const u=u0+(u1-u0)*i/nu;
    for(let j=0;j<=nv;j++){
      const v=v0+(v1-v0)*j/nv;
      const s=surf(u,v);
      let off=base;
      if(thick>0){
        off += thick*Math.pow(Math.max(0,Math.sin(PI*i/nu)),0.6)*Math.pow(Math.max(0,Math.sin(PI*j/nv)),0.6);
      }
      pos.push(s.p.x+s.n.x*off, s.p.y+s.n.y*off, s.p.z+s.n.z*off);
    }
  }
  for(let i=0;i<nu;i++){
    for(let j=0;j<nv;j++){
      const a=i*(nv+1)+j, b=a+1, c=(i+1)*(nv+1)+j, d=c+1;
      idx.push(a,b,c, b,d,c);
    }
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function prof(k,y){
  if(y>=k[0][0]) return [k[0][1],k[0][2]];
  for(let i=0;i<k.length-1;i++){
    if(y>=k[i+1][0]){
      const t=(k[i][0]-y)/(k[i][0]-k[i+1][0]);
      return [lerp(k[i][1],k[i+1][1],t), lerp(k[i][2],k[i+1][2],t)];
    }
  }
  const l=k[k.length-1]; return [l[1],l[2]];
}

    const ab=prof(k,y), a=ab[0], b=ab[1];
    const s=Math.sin(phi), c=Math.cos(phi);
    return {p:V(a*s,y,b*c), n:V(s/a,0,c/b).normalize()};
  };
}

    const r=rad(s);
    return {p:V(r*Math.cos(psi),-s*L,r*Math.sin(psi)), n:V(Math.cos(psi),0,Math.sin(psi))};
  };
}

  return s=>{
    if(s<=k[0][0]) return k[0][1];
    for(let i=0;i<k.length-1;i++){
      if(s<=k[i+1][0]){const t=(s-k[i][0])/(k[i+1][0]-k[i][0]); return lerp(k[i][1],k[i+1][1],t);}
    }
    return k[k.length-1][1];
  };
}

const _m=new T.Matrix4();
function orient(g,from,to,hint){
  const y=from.clone().sub(to).normalize();
  const z=hint.clone().addScaledVector(y,-hint.dot(y));
  if(z.lengthSq()<1e-8){ z.set(1,0,0).addScaledVector(y,-y.x); }
  z.normalize();
  const x=new T.Vector3().crossVectors(y,z);
  _m.makeBasis(x,y,z);
  g.quaternion.setFromRotationMatrix(_m);
  g.position.copy(from);
}
function ik2(A,Tg,l1,l2,pole){
  const AT=Tg.clone().sub(A); const d=AT.length();
  const dir=d>1e-6 ? AT.clone().multiplyScalar(1/d) : V(0,-1,0);
  const dc=clamp(d,Math.abs(l1-l2)+1e-4,l1+l2-1e-4);
  const a=(l1*l1-l2*l2+dc*dc)/(2*dc);
  const h=Math.sqrt(Math.max(l1*l1-a*a,0));
  const perp=pole.clone().addScaledVector(dir,-pole.dot(dir));
  if(perp.lengthSq()<1e-8){ perp.set(0,0,1).addScaledVector(dir,-dir.z); }
  perp.normalize();
  const E=A.clone().addScaledVector(dir,a).addScaledVector(perp,h);
  const W=E.clone().add(Tg.clone().sub(E).normalize().multiplyScalar(l2));
  return {E:E,W:W,perp:perp};
}
