# Cloud Build trigger path: apps/web/cloudbuild.yaml
# Build context: repository root (required by pnpm workspace packages).
# Defaults target the current SmartFit GCP project and FastAPI Cloud Run service.
substitutions:
  _REGION: europe-west1
  _SERVICE: smartfit-web
  _AR_REPOSITORY: cloud-run-source-deploy
  _API_INTERNAL_URL: https://smartfit-276316729948.europe-west1.run.app

steps:
  # Fail early rather than deploying a frontend pointing to an invalid URL.
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        case "${_API_INTERNAL_URL}" in
          https://*.*) ;;
          *) echo "Set _API_INTERNAL_URL to the real HTTPS URL of the FastAPI Cloud Run service." >&2; exit 1 ;;
        esac
        if [[ "${_API_INTERNAL_URL}" == "https://smartfit-367317612865.europe-west1.run.app" ]]; then
          echo "_API_INTERNAL_URL still points to the previous Google Cloud project." >&2
          exit 1
        fi
        if [[ "${_API_INTERNAL_URL}" == *REPLACE_WITH_BACKEND_CLOUD_RUN_URL* ]]; then
          echo "_API_INTERNAL_URL still contains the example placeholder." >&2
          exit 1
        fi

  # Generate the API schema and TypeScript contracts before the Docker build.
  # These generated files are intentionally produced from the FastAPI source of truth.
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir -r backend/requirements.txt
        python backend/scripts/export_openapi.py

  - name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@10.12.1 --activate
        pnpm --filter @smartfit/contracts generate

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min=0
      - --max=5
      - --set-env-vars=API_INTERNAL_URL=${_API_INTERNAL_URL}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
