# Cloud Build trigger path: apps/web/cloudbuild.yaml
# Build context: repository root (required by pnpm workspace packages).
# Set _API_INTERNAL_URL in the trigger to the real HTTPS URL of FastAPI.
substitutions:
  _REGION: europe-west1
  _SERVICE: smartfit-web
  _AR_REPOSITORY: cloud-run-source-deploy
  _API_INTERNAL_URL: https://REPLACE_WITH_BACKEND_CLOUD_RUN_URL

steps:
  # Fail early rather than deploying a frontend pointing to the placeholder URL.
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        case "${_API_INTERNAL_URL}" in
          https://*.*) ;;
          *) echo "Set _API_INTERNAL_URL to the real HTTPS URL of the FastAPI Cloud Run service." >&2; exit 1 ;;
        esac
        if [[ "${_API_INTERNAL_URL}" == *REPLACE_WITH_BACKEND_CLOUD_RUN_URL* ]]; then
          echo "_API_INTERNAL_URL still contains the example placeholder." >&2
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min=0
      - --max=5
      - --set-env-vars=API_INTERNAL_URL=${_API_INTERNAL_URL}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
